stages:
  - test
  - import

# Pipeline tests now include the real Sharp mask upload boundary.
# Install dependencies rather than letting missing runtime imports pass unnoticed.
webtoon_contract_tests:
  stage: test
  image: node:22-bookworm-slim
  script:
    - npm ci
    - npm run test:webtoon

# Full integration gate. A green contract test alone does not prove a working Next.js app.
webtoon_typecheck_build:
  stage: test
  image: node:22-bookworm-slim
  variables:
    NEXT_TELEMETRY_DISABLED: "1"
    NODE_OPTIONS: "--max-old-space-size=4096"
  script:
    - npm ci
    - npx tsc --noEmit
    - npm run build

# Optional one-time upstream Git history import; never overwrites main.
import_upstream:
  stage: import
  image: alpine:3.20
  before_script:
    - apk add --no-cache git ca-certificates
  script:
    - sh scripts/import-upstream.sh
  when: manual
  allow_failure: true
