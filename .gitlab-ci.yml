stages:
  - test
  - import

# Does not require npm ci: the webtoon contract tests use only Node built-ins.
webtoon_contract_tests:
  stage: test
  image: node:22-alpine
  script:
    - npm run test:webtoon

# Optional one-time upstream Git history import; never overwrites main.
import_upstream:
  stage: import
  image: alpine:3.20
  before_script:
    - apk add --no-cache git ca-certificates
  script:
    - sh scripts/import-upstream.sh
  when: manual
  allow_failure: true
