stages:
  - import

# One-time migration of the original Git history into a separate branch.
# Enable CI/CD > Job token permissions > Allow Git push requests first.
import_upstream:
  stage: import
  image: alpine:3.20
  before_script:
    - apk add --no-cache git ca-certificates
  script:
    - sh scripts/import-upstream.sh
  when: manual
  allow_failure: false
